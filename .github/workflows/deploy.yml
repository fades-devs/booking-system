name: "Deploy Services to ECS"

on:
  push:
    branches: [ "main" ]
    # This workflow runs if ANY of these folders change
    paths:
      - 'room-service/**'
      - 'user-service/**'
      - 'booking-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- ROOM SERVICE ---
      # This step ONLY runs if the room-service folder changed
      - name: Build & Deploy Room Service
        if: contains(toJson(github.event.commits), 'room-service/')
        run: |
          # 1. Enter the directory
          cd ./room-service
          
          # 2. Install dependencies (Clean install)
          npm ci
          
          # 3. Run automated tests
          npm test

          # 4. If tests pass, step back out and build the Docker image
          cd ..
          docker build --platform linux/amd64 -t fadesdevs/room-service:latest ./room-service
          docker push fadesdevs/room-service:latest
          aws ecs update-service --cluster booking-app-cluster --service room-service --force-new-deployment

      # --- USER SERVICE ---
      # This step ONLY runs if the user-service folder changed
      - name: Build & Deploy User Service
        if: contains(toJson(github.event.commits), 'user-service/')
        run: |
          # 1. Enter the directory
          cd ./user-service
          
          # 2. Install dependencies (Clean install)
          npm ci
          
          # 3. Run automated tests
          npm test

          # 4. If tests pass, step back out and build the Docker image
          cd ..
          docker build --platform linux/amd64 -t fadesdevs/user-service:latest ./user-service
          docker push fadesdevs/user-service:latest
          aws ecs update-service --cluster booking-app-cluster --service user-service --force-new-deployment

      # --- BOOKING SERVICE ---
      # This step ONLY runs if the booking-service folder changed
      - name: Build & Deploy Booking Service
        if: contains(toJson(github.event.commits), 'booking-service/')
        run: |
          # 1. Enter the directory
          cd ./booking-service
          
          # 2. Install dependencies (Clean install)
          npm ci
          
          # 3. Run automated tests
          npm test

          # 4. If tests pass, step back out and build the Docker image
          cd ..
          docker build --platform linux/amd64 -t fadesdevs/booking-service:latest ./booking-service
          docker push fadesdevs/booking-service:latest
          aws ecs update-service --cluster booking-app-cluster --service booking-service --force-new-deployment