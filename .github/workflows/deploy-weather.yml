name: "Deploy Weather Lambda"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'weather-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies & Zip
        run: |
          cd ./weather-service
          npm ci
          # Zip the CONTENTS of the folder, not the folder itself
          zip -r ../weather-service.zip ./* - name: Deploy to AWS Lambda
        run: |
          # Lambda function name in AWS
          aws lambda update-function-code \
            --function-name weather_service \
            --zip-file fileb://weather-service.zip